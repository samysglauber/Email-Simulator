<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SESI Mail — Simulador de E-mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233F;
    --ink-soft:#223357;
    --ink-softer:#2c3f68;
    --paper:#FAF9F6;
    --paper-dim:#F1EFE9;
    --line:#E3DFD3;
    --text:#1F2430;
    --text-dim:#6B7280;
    --accent:#2E8B87;
    --accent-dim:#DDEEEC;
    --warm:#E8A33D;
    --warm-dim:#FBEED9;
    --danger:#C1554A;
    --danger-dim:#F6E4E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:transparent;
    height:100vh;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:220px 320px 1fr;
    height:100vh;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--ink);
    color:#fff;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 4px;
  }
  .brand svg{flex-shrink:0;}
  .brand-name{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .compose-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:11px 16px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:transform .12s ease, background .15s ease;
  }
  .compose-btn:hover{background:#257a76; transform:translateY(-1px);}
  .folders{display:flex; flex-direction:column; gap:2px; margin-top:4px;}
  .folder{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    color:#C9D2E4;
    position:relative;
    transition:background .12s ease, color .12s ease;
  }
  .folder svg{opacity:.85; flex-shrink:0;}
  .folder:hover{background:var(--ink-soft); color:#fff;}
  .folder.active{background:var(--ink-softer); color:#fff;}
  .folder.active::before{
    content:"";
    position:absolute;
    left:-14px;
    top:8px;
    bottom:8px;
    width:3px;
    background:var(--warm);
    border-radius:2px;
  }
  .folder-name{flex:1;}
  .folder-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(255,255,255,0.12);
    padding:1px 7px;
    border-radius:999px;
    color:#fff;
  }
  .folder-count.unread{background:var(--warm); color:#1F2430; font-weight:600;}
  .sidebar-foot{
    margin-top:auto;
    font-size:11px;
    color:#7C88A6;
    padding:0 4px;
    line-height:1.5;
  }

  /* ---------- LIST ---------- */
  .list-pane{
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    background:var(--paper);
    min-width:0;
  }
  .list-header{
    padding:16px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .list-title{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    margin:0 0 10px;
  }
  .search{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 10px;
  }
  .search input{
    border:none;
    background:transparent;
    outline:none;
    font-size:13px;
    font-family:'Inter',sans-serif;
    width:100%;
    color:var(--text);
  }
  .msg-list{
    overflow-y:auto;
    flex:1;
  }
  .msg-item{
    padding:13px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:background .1s ease;
  }
  .msg-item:hover{background:var(--paper-dim);}
  .msg-item.selected{background:var(--accent-dim);}
  .msg-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    margin-top:6px;
    flex-shrink:0;
    visibility:hidden;
  }
  .msg-item.unread .msg-dot{visibility:visible;}
  .msg-body{min-width:0; flex:1;}
  .msg-row1{display:flex; justify-content:space-between; gap:8px;}
  .msg-from{
    font-size:13.5px;
    color:var(--text);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .msg-item.unread .msg-from{font-weight:700;}
  .msg-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    flex-shrink:0;
    padding-top:1px;
  }
  .msg-subject{
    font-size:13px;
    color:var(--text);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .msg-item.unread .msg-subject{font-weight:600;}
  .msg-snippet{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .msg-meta-icons{display:flex; gap:4px; margin-top:4px;}
  .empty-list{
    padding:40px 20px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
  }

  /* ---------- READING PANE ---------- */
  .read-pane{
    display:flex;
    flex-direction:column;
    min-width:0;
    background:var(--paper);
  }
  .read-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--text-dim);
  }
  .read-empty svg{opacity:.35;}
  .read-toolbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:12px 22px;
    border-bottom:1px solid var(--line);
  }
  .tool-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:7px;
    padding:7px 12px;
    font-size:12.5px;
    font-weight:500;
    font-family:'Inter',sans-serif;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .1s ease, border-color .1s ease;
  }
  .tool-btn:hover{background:var(--paper-dim); border-color:#cfc9b8;}
  .tool-btn.danger:hover{background:var(--danger-dim); border-color:var(--danger); color:var(--danger);}
  .tool-btn.star.active{background:var(--warm-dim); border-color:var(--warm); color:#8a5b0f;}
  .read-scroll{
    flex:1;
    overflow-y:auto;
    padding:24px 30px 40px;
  }
  .read-subject{
    font-family:'Fraunces',serif;
    font-size:23px;
    font-weight:600;
    margin:0 0 16px;
    color:var(--ink);
  }
  .read-from-row{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; flex-shrink:0;
    font-family:'Inter',sans-serif;
  }
  .read-from-name{font-size:14px; font-weight:600;}
  .read-from-email{font-size:12px; color:var(--text-dim);}
  .read-to{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .read-date{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim); white-space:nowrap;}
  .read-content{
    font-size:14.5px;
    line-height:1.75;
    color:var(--text);
    white-space:pre-wrap;
  }
  .attachments{
    margin-top:22px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .attachment-chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    padding:7px 11px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    transition:background .1s ease;
  }
  .attachment-chip:hover{background:#ece7d8;}
  .quote-block{
    margin-top:18px;
    padding:12px 14px;
    border-left:3px solid var(--line);
    color:var(--text-dim);
    font-size:12.5px;
    background:var(--paper-dim);
    border-radius:0 6px 6px 0;
    white-space:pre-wrap;
  }

  /* ---------- COMPOSE MODAL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(22,35,63,.35);
    display:none;
    align-items:flex-end;
    justify-content:flex-end;
    padding:24px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .compose{
    background:#fff;
    width:480px;
    max-width:100%;
    border-radius:12px 12px 0 0;
    box-shadow:0 -8px 40px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    max-height:85vh;
    animation:rise .18s ease;
  }
  @keyframes rise{ from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .compose-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    background:var(--ink);
    color:#fff;
    border-radius:12px 12px 0 0;
    font-size:13px;
    font-weight:600;
  }
  .compose-head button{
    background:none; border:none; color:#C9D2E4; cursor:pointer; font-size:16px; line-height:1;
  }
  .compose-body{padding:14px 16px; display:flex; flex-direction:column; gap:0; overflow-y:auto;}
  .compose-field{
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--line);
    padding:9px 2px;
    gap:8px;
  }
  .compose-field label{font-size:12.5px; color:var(--text-dim); width:52px; flex-shrink:0;}
  .compose-field input, .compose-field textarea{
    border:none; outline:none; font-family:'Inter',sans-serif; font-size:13.5px; width:100%; color:var(--text);
  }
  .compose-body-field textarea{
    border:none; outline:none; resize:vertical; font-family:'Inter',sans-serif; font-size:13.5px;
    min-height:160px; padding:12px 2px; color:var(--text); line-height:1.6;
  }
  .compose-attachments{display:flex; flex-wrap:wrap; gap:6px; padding:8px 2px 0;}
  .compose-foot{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-top:1px solid var(--line);
  }
  .send-btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:9px 18px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .send-btn:hover{background:#257a76;}
  .attach-btn{
    border:none; background:none; color:var(--text-dim); cursor:pointer; font-size:13px;
    display:flex; align-items:center; gap:6px;
  }
  .attach-btn:hover{color:var(--accent);}
  .attach-menu{
    position:relative;
  }
  .attach-dropdown{
    position:absolute; bottom:28px; left:0;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
    display:none; flex-direction:column; min-width:170px; overflow:hidden; z-index:5;
  }
  .attach-dropdown.open{display:flex;}
  .attach-dropdown button{
    border:none; background:#fff; text-align:left; padding:9px 12px; font-size:12.5px;
    cursor:pointer; font-family:'Inter',sans-serif; color:var(--text);
  }
  .attach-dropdown button:hover{background:var(--paper-dim);}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#D8D3C4; border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:820px){
    .app{grid-template-columns: 1fr; grid-template-rows:auto 1fr;}
    .sidebar{flex-direction:row; align-items:center; overflow-x:auto; padding:12px;}
    .folders{flex-direction:row;}
    .sidebar-foot{display:none;}
    .list-pane, .read-pane{display:none;}
    .app.view-list .list-pane{display:flex;}
    .app.view-read .read-pane{display:flex;}
    .compose{width:100%;}
  }
</style>
</head>
<body>

<div class="app view-list" id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="1.5" y="4.5" width="21" height="15" rx="2.5" stroke="#E8A33D" stroke-width="1.6"/><path d="M2.5 6L12 13.5L21.5 6" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">SESI Mail</span>
    </div>
    <button class="compose-btn" onclick="openCompose()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      Escrever
    </button>
    <div class="folders" id="folders"></div>
    <div class="sidebar-foot">Simulador de e-mail para prática em sala.<br>Nenhum e-mail é enviado de verdade.</div>
  </div>

  <!-- LIST -->
  <div class="list-pane">
    <div class="list-header">
      <p class="list-title" id="listTitle">Caixa de entrada</p>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6B7280" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Pesquisar por remetente ou assunto" oninput="renderList()">
      </div>
    </div>
    <div class="msg-list" id="msgList"></div>
  </div>

  <!-- READ -->
  <div class="read-pane" id="readPane">
    <div class="read-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><rect x="1.5" y="4.5" width="21" height="15" rx="2.5" stroke="#6B7280" stroke-width="1.4"/><path d="M2.5 6L12 13.5L21.5 6" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Selecione um e-mail para ler</p>
    </div>
  </div>
</div>

<!-- COMPOSE MODAL -->
<div class="overlay" id="overlay">
  <div class="compose">
    <div class="compose-head">
      <span id="composeTitle">Nova mensagem</span>
      <button onclick="closeCompose()">✕</button>
    </div>
    <div class="compose-body">
      <div class="compose-field">
        <label>Para</label>
        <input id="fieldTo" list="contactList" placeholder="nome@escola.edu.br">
        <datalist id="contactList"></datalist>
      </div>
      <div class="compose-field">
        <label>Assunto</label>
        <input id="fieldSubject" placeholder="Assunto do e-mail">
      </div>
      <div class="compose-body-field">
        <textarea id="fieldBody" placeholder="Escreva sua mensagem aqui..."></textarea>
      </div>
      <div class="compose-attachments" id="composeAttachments"></div>
    </div>
    <div class="compose-foot">
      <div style="display:flex; gap:14px; align-items:center;">
        <div class="attach-menu">
          <button class="attach-btn" onclick="toggleAttachMenu(event)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Exemplo
          </button>
          <div class="attach-dropdown" id="attachDropdown"></div>
        </div>
        <button class="attach-btn" onclick="document.getElementById('realFileInput').click()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"/></svg>
          Do computador
        </button>
        <input type="file" id="realFileInput" multiple style="display:none" onchange="handleRealFile(event)">
      </div>
      <button class="send-btn" onclick="sendCompose()">Enviar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- DADOS ---------------- */
const contacts = [
  {name:"Profª Marina Duarte", email:"marina.duarte@escola.edu.br"},
  {name:"Coordenação Pedagógica", email:"coordenacao@escola.edu.br"},
  {name:"Biblioteca Escolar", email:"biblioteca@escola.edu.br"},

  {name:"Prof. Eduardo Lima", email:"eduardo.lima@escola.edu.br"},
];

  "marina.duarte@escola.edu.br":"Obrigada pelo retorno! Recebi seu e-mail e vamos conversar sobre isso na próxima aula.",

};

let emails = [
  {
    id:1, folder:"inbox", unread:true, starred:true,
    from:"Prof. Eduardo Lima", fromEmail:"eduardo.lima@escola.edu.br",
    to:ME.email, subject:"Bem-vindo(a) ao SESI Mail!",
    date:"08/08 09:12",
    body:"Olá!\n\nEste é o SESI Mail, nosso simulador de e-mail para a aula de informática. Aqui você pode:\n\n• Ler as mensagens da caixa de entrada\n• Responder e-mails (a resposta é salva em 'Enviados')\n• Anexar arquivos simulados\n• Organizar mensagens: marcar como importante, arquivar ou excluir\n\nNenhuma mensagem sai da sua tela — é tudo seguro para praticar. Bons estudos!\n\nProf. Eduardo",
    attachments:[]

  {

    body:"Olá, turma!\n\nO prazo de entrega do trabalho sobre relevo brasileiro foi prorrogado para a próxima sexta-feira. Aproveitem o tempo extra para revisar as fontes utilizadas.\n\nQualquer dúvida, respondam este e-mail.\n\nAtenciosamente,\nProfª Marina",
    attachments:[]
  },
  {
    id:3, folder:"inbox", unread:false, starred:false,
    from:"Coordenação Pedagógica", fromEmail:"coordenacao@escola.edu.br",
    to:ME.email, subject:"Reunião de pais — próxima sexta",
    date:"06/08 11:02",
    body:"Prezados,\n\nInformamos que a reunião de pais e responsáveis ocorrerá na próxima sexta-feira, às 19h, no auditório da escola. A presença é importante para tratarmos do calendário do segundo semestre.\n\nContamos com a colaboração de todos.",
    attachments:[]
  },
  {
    id:4, folder:"inbox", unread:true, starred:false,
    from:"Biblioteca Escolar", fromEmail:"biblioteca@escola.edu.br",
    to:ME.email, subject:"Lembrete: devolução de livro",
    date:"05/08 08:47",
    body:"Olá!\n\nEste é um lembrete de que o livro emprestado tem devolução prevista para amanhã. Em anexo, a lista atualizada do acervo disponível para o próximo empréstimo.\n\nBibliteca Escolar",
    attachments:["lista_livros.pdf"]
  },
  {
    id:5, folder:"inbox", unread:false, starred:false,
    from:"Rafael Souza", fromEmail:"rafael.souza@escola.edu.br",
    to:ME.email, subject:"Dúvida sobre o trabalho de grupo",
    date:"04/08 16:20",
    body:"E aí!\n\nVocê ficou com a parte da introdução ou da conclusão do trabalho? Fiquei em dúvida aqui e quero começar a escrever hoje ainda.\n\nMe responde quando puder!\n\nRafael",
    attachments:[]
  },
  {
    id:6, folder:"inbox", unread:false, starred:true,
    from:"Secretaria", fromEmail:"secretaria@escola.edu.br",
    to:ME.email, subject:"Confirmação de matrícula 2027",
    date:"02/08 10:00",
    body:"Prezado(a) aluno(a),\n\nConfirmamos o recebimento da documentação de matrícula para o ano letivo de 2027. Em anexo, segue o comprovante para seus registros.\n\nSecretaria Escolar",
    attachments:["comprovante.pdf"]
  }
];
let nextId = 7;

const sampleFiles = ["trabalho.docx","apresentacao.pptx","planilha.xlsx","foto.jpg","desenho.png"];

/* ---------------- ESTADO ---------------- */
let currentFolder = "inbox";
let selectedId = null;
let composeAttachments = [];
let replyToId = null;

const folderDefs = [
  {id:"inbox", label:"Caixa de entrada", icon:'<path d="M2 12l3-8h14l3 8M2 12v6a1 1 0 001 1h18a1 1 0 001-1v-6M2 12h6l1.5 3h5L16 12h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'},
  {id:"starred", label:"Importantes", icon:'<path d="M12 2.5l2.9 6.4 6.9.7-5.2 4.7 1.5 6.9L12 17.8l-6.1 3.4 1.5-6.9-5.2-4.7 6.9-.7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>'},
  {id:"sent", label:"Enviados", icon:'<path d="M3 11l18-8-8 18-2.5-7.5L3 11z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/>'},
  {id:"archive", label:"Arquivados", icon:'<rect x="3" y="7" width="18" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3 7l2-4h14l2 4M10 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
  {id:"trash", label:"Lixeira", icon:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'},
];

/* ---------------- INIT ---------------- */
function init(){
  document.getElementById("contactList").innerHTML = contacts.map(c=>`<option value="${c.email}">`).join("");
  renderFolders();
  renderList();
  showToast("Bem-vindo(a) ao SESI Mail 👋");
}

function renderFolders(){
  const wrap = document.getElementById("folders");
  wrap.innerHTML = folderDefs.map(f=>{
    let count;
    if(f.id==="inbox"){
      const unread = emails.filter(e=>e.folder==="inbox" && e.unread).length;
      count = unread>0 ? `<span class="folder-count unread">${unread}</span>` : `<span class="folder-count">${emails.filter(e=>e.folder==="inbox").length}</span>`;
    } else if(f.id==="starred"){
      count = `<span class="folder-count">${emails.filter(e=>e.starred && e.folder!=="trash").length}</span>`;
    } else {
      count = `<span class="folder-count">${emails.filter(e=>e.folder===f.id).length}</span>`;
    }
    return `<div class="folder ${currentFolder===f.id?'active':''}" onclick="selectFolder('${f.id}')">
      <svg width="16" height="16" viewBox="0 0 24 24">${f.icon}</svg>
      <span class="folder-name">${f.label}</span>
      ${count}
    </div>`;
  }).join("");
}

function selectFolder(id){
  currentFolder = id;
  selectedId = null;
  document.getElementById("listTitle").textContent = folderDefs.find(f=>f.id===id).label;
  document.getElementById("app").classList.remove("view-read");
  document.getElementById("app").classList.add("view-list");
  renderFolders();
  renderList();
  renderRead();
}

function currentEmails(){
  const q = (document.getElementById("searchInput").value||"").toLowerCase();
  let list;
  if(currentFolder==="starred"){
    list = emails.filter(e=>e.starred && e.folder!=="trash");
  } else {
    list = emails.filter(e=>e.folder===currentFolder);
  }
  if(q){
    list = list.filter(e=> e.from.toLowerCase().includes(q) || e.subject.toLowerCase().includes(q) || (e.to||"").toLowerCase().includes(q));
  }
  return list.sort((a,b)=>b.id-a.id);
}

function renderList(){
  const list = currentEmails();
  const wrap = document.getElementById("msgList");
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-list">Nenhuma mensagem aqui.</div>`;
    return;
  }
  wrap.innerHTML = list.map(e=>`
    <div class="msg-item ${e.unread?'unread':''} ${selectedId===e.id?'selected':''}" onclick="openEmail(${e.id})">
      <div class="msg-dot"></div>
      <div class="msg-body">
        <div class="msg-row1">
          <div class="msg-from">${currentFolder==='sent' ? 'Para: '+e.to : e.from}</div>
          <div class="msg-date">${e.date}</div>
        </div>
        <div class="msg-subject">${e.subject}${e.starred?' ★':''}</div>
        <div class="msg-snippet">${e.body.split("\\n")[0].slice(0,70)}</div>
      </div>
    </div>
  `).join("");
}

function openEmail(id){
  selectedId = id;
  const e = emails.find(x=>x.id===id);
  if(e && e.unread){ e.unread = false; renderFolders(); }
  renderList();
  renderRead();
  document.getElementById("app").classList.remove("view-list");
  document.getElementById("app").classList.add("view-read");
}

function initials(name){
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function renderRead(){
  const pane = document.getElementById("readPane");
  const e = emails.find(x=>x.id===selectedId);
  if(!e){
    pane.innerHTML = `<div class="read-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><rect x="1.5" y="4.5" width="21" height="15" rx="2.5" stroke="#6B7280" stroke-width="1.4"/><path d="M2.5 6L12 13.5L21.5 6" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Selecione um e-mail para ler</p>
    </div>`;
    return;
  }
  const inTrash = e.folder==="trash";
  pane.innerHTML = `
    <div class="read-toolbar">
      <button class="tool-btn" onclick="backToList()">← Voltar</button>
      ${!inTrash ? `<button class="tool-btn" onclick="startReply(${e.id})">↩ Responder</button>`:''}
      ${!inTrash ? `<button class="tool-btn star ${e.starred?'active':''}" onclick="toggleStar(${e.id})">★ ${e.starred?'Importante':'Marcar importante'}</button>`:''}
      ${currentFolder!=='archive' && !inTrash ? `<button class="tool-btn" onclick="moveTo(${e.id},'archive')">🗄 Arquivar</button>`:''}
      ${currentFolder==='archive' ? `<button class="tool-btn" onclick="moveTo(${e.id},'inbox')">↩ Mover p/ caixa de entrada</button>`:''}
      ${!inTrash ? `<button class="tool-btn danger" onclick="moveTo(${e.id},'trash')">🗑 Excluir</button>` : `
        <button class="tool-btn" onclick="moveTo(${e.id},'inbox')">↩ Restaurar</button>
        <button class="tool-btn danger" onclick="deleteForever(${e.id})">Excluir definitivamente</button>
      `}
    </div>
    <div class="read-scroll">
      <h2 class="read-subject">${e.subject}</h2>
      <div class="read-from-row">
        <div class="avatar">${initials(e.from)}</div>
        <div>
          <div class="read-from-name">${e.from}</div>
          <div class="read-from-email">${e.fromEmail || ''}</div>
          <div class="read-to">Para: ${e.to}</div>
        </div>
        <div class="read-date">${e.date}</div>
      </div>
      <div class="read-content">${e.body}</div>
      ${e.attachments.length ? `<div class="attachments">${e.attachments.map((a,i)=>{
        const obj = typeof a === 'string' ? {name:a} : a;
        return `<div class="attachment-chip" onclick="downloadAttachment(${e.id}, ${i})">
          📎 ${obj.name}${obj.size?' · '+obj.size:''}
        </div>`;
      }).join("")}</div>` : ''}
    </div>
  `;
}

function backToList(){
  document.getElementById("app").classList.remove("view-read");
  document.getElementById("app").classList.add("view-list");
}

function toggleStar(id){
  const e = emails.find(x=>x.id===id);
  e.starred = !e.starred;
  renderFolders(); renderList(); renderRead();
}

function moveTo(id, folder){
  const e = emails.find(x=>x.id===id);
  e.folder = folder;
  showToast(folder==='trash' ? 'Mensagem movida para a Lixeira' : folder==='archive' ? 'Mensagem arquivada' : 'Mensagem restaurada');
  selectedId = null;
  renderFolders(); renderList(); renderRead();
  document.getElementById("app").classList.remove("view-read");
  document.getElementById("app").classList.add("view-list");
}

function deleteForever(id){
  emails = emails.filter(x=>x.id!==id);
  selectedId = null;
  showToast('Mensagem excluída definitivamente');
  renderFolders(); renderList(); renderRead();
  document.getElementById("app").classList.remove("view-read");
  document.getElementById("app").classList.add("view-list");
}

function downloadAttachment(emailId, idx){
  const e = emails.find(x=>x.id===emailId);
  if(!e) return;
  const a = e.attachments[idx];
  const obj = typeof a === 'string' ? {name:a} : a;
  if(obj.url){
    const link = document.createElement('a');
    link.href = obj.url;
    link.download = obj.name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    showToast(`Baixando "${obj.name}"...`);
  } else {
    showToast(`📎 "${obj.name}" — em um e-mail real, o download começaria agora.`);
  }
}

/* ---------------- COMPOR / RESPONDER ---------------- */
function openCompose(){
  replyToId = null;
  document.getElementById("composeTitle").textContent = "Nova mensagem";
  document.getElementById("fieldTo").value = "";
  document.getElementById("fieldSubject").value = "";
  document.getElementById("fieldBody").value = "";
  composeAttachments = [];
  renderComposeAttachments();
  document.getElementById("overlay").classList.add("open");
  buildAttachMenu();
}

function startReply(id){
  const e = emails.find(x=>x.id===id);
  replyToId = id;
  document.getElementById("composeTitle").textContent = "Responder";
  document.getElementById("fieldTo").value = e.fromEmail;
  document.getElementById("fieldSubject").value = e.subject.startsWith("Re:") ? e.subject : "Re: "+e.subject;
  document.getElementById("fieldBody").value = "";
  composeAttachments = [];
  renderComposeAttachments();
  document.getElementById("overlay").classList.add("open");
  buildAttachMenu();
}

function closeCompose(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("attachDropdown").classList.remove("open");
}

function buildAttachMenu(){
  const menu = document.getElementById("attachDropdown");
  menu.innerHTML = sampleFiles.map(f=>`<button onclick="addAttachment('${f}')">📎 ${f}</button>`).join("");
}
function toggleAttachMenu(ev){
  ev.stopPropagation();
  document.getElementById("attachDropdown").classList.toggle("open");
}
document.addEventListener("click", ()=> document.getElementById("attachDropdown").classList.remove("open"));

function addAttachment(name){
  if(!composeAttachments.some(a=>a.name===name)) composeAttachments.push({name});
  renderComposeAttachments();
  document.getElementById("attachDropdown").classList.remove("open");
}
function removeAttachment(name){
  composeAttachments = composeAttachments.filter(a=>a.name!==name);
  renderComposeAttachments();
}
function renderComposeAttachments(){
  document.getElementById("composeAttachments").innerHTML = composeAttachments.map(a=>`
    <div class="attachment-chip" onclick="removeAttachment('${a.name}')">📎 ${a.name}${a.size?' · '+a.size:''} ✕</div>
  `).join("");
}
function formatSize(bytes){
  if(bytes < 1024) return bytes+" B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}
function handleRealFile(event){
  const files = Array.from(event.target.files || []);
  files.forEach(file=>{
    const url = URL.createObjectURL(file);
    if(!composeAttachments.some(a=>a.name===file.name)){
      composeAttachments.push({name:file.name, url, size:formatSize(file.size)});
    }
  });
  renderComposeAttachments();
  event.target.value = "";
  if(files.length===1) showToast(`Arquivo "${files[0].name}" anexado.`);
  else if(files.length>1) showToast(`${files.length} arquivos anexados.`);
}

function sendCompose(){
  const to = document.getElementById("fieldTo").value.trim();
  const subject = document.getElementById("fieldSubject").value.trim() || "(sem assunto)";
  const body = document.getElementById("fieldBody").value.trim();

  if(!to){ showToast("Preencha o campo 'Para' antes de enviar."); return; }
  if(!body){ showToast("Escreva uma mensagem antes de enviar."); return; }

  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + " " + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  let quoted = "";
  if(replyToId){
    const orig = emails.find(x=>x.id===replyToId);
    if(orig) quoted = `\n\n— Mensagem original de ${orig.from} —\n${orig.body}`;
  }

  const sentEmail = {
    id: nextId++, folder:"sent", unread:false, starred:false,
    from: ME.name, fromEmail: ME.email,
    to: to, subject: subject, date: dateStr,
    body: body + quoted,
    attachments: [...composeAttachments]
  };
  emails.push(sentEmail);
  closeCompose();
  showToast("Mensagem enviada ✔");
  currentFolder = "sent";
  renderFolders(); renderList(); renderRead();

  const contact = contacts.find(c=>c.email===to);
  if(contact && autoReplies[contact.email]){
    setTimeout(()=>{
      emails.push({
        id: nextId++, folder:"inbox", unread:true, starred:false,
        from: contact.name, fromEmail: contact.email,
        to: ME.email, subject: "Re: "+subject, date:"agora",
        body: autoReplies[contact.email],
        attachments:[]
      });
      renderFolders();
      if(currentFolder==="inbox") renderList();
      showToast(`Nova resposta de ${contact.name}`);
    }, 2200);
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove("show"), 2800);
}

init();
</script>
</body>
</html>
